<app-hero
  title="Asistente IA Operativo Entry para poner orden en tu negocio"
  subtitle="Ahora mismo estamos enfocados en una sola implementación: Servicio D-Entry. Rápido, claro y orientado a resultados desde la primera semana."
  primaryLabel="Ver Servicio Entry"
  primaryRoute="/servicios/asistente-ia-operativo"
  secondaryLabel="Reservar diagnóstico (20 min)"
  [stats]="heroStats"
/>

<section class="container section-grid">
  <h2>Servicio activo en esta fase</h2>
  <div class="cards-grid">
    @for (service of services; track service.title) {
      <p-card [header]="service.title"><p>{{ service.description }}</p></p-card>
    }
  </div>
</section>

<section class="container section-grid">
  <h2>Método de trabajo</h2>
  <app-process-steps [steps]="process" />
</section>

<section class="container section-grid">
  <h2>FAQ rápida</h2>
  <app-faq-accordion [items]="faq" />
</section>

<section class="container section-grid cta-final">
  <h2>¿Quieres ordenar operación y ganar foco esta semana?</h2>
  <div class="cta-group">
    <app-whatsapp-cta [number]="contactConfig.whatsappNumber" [message]="contactConfig.whatsappMessage" />
    <a routerLink="/contacto"><p-button label="Ir a contacto" severity="secondary" /></a>
  </div>
</section>
