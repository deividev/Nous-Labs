<section class="hero">
  <div class="container hero-inner">
    <h1>{{ title() }}</h1>
    <p>{{ subtitle() }}</p>
    <div class="hero-cta">
      <a [routerLink]="primaryRoute()"><p-button [label]="primaryLabel()" /></a>
      <a [routerLink]="secondaryRoute()"><p-button [label]="secondaryLabel()" severity="secondary" /></a>
    </div>

    @if (stats().length) {
      <div class="hero-stats">
        @for (stat of stats(); track stat) {
          <span class="stat-chip">{{ stat }}</span>
        }
      </div>
    }
  </div>
</section>
